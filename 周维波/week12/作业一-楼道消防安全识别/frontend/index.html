<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>楼道消防安全风险识别</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 1 18 0"/><path d="M12 8v5"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1>楼道消防安全风险识别</h1>
      <p>拍照或上传图片，AI 实时识别楼道消防隐患</p>
    </div>
  </div>
</header>

<main>
  <!-- 模型选择 -->
  <section class="card">
    <div class="seg" id="modelSeg" role="tablist">
      <button type="button" data-provider="deepseek" class="active">ds flash 4.1</button>
      <button type="button" data-provider="qwen">qwen-vl-max</button>
      <button type="button" data-provider="mock">演示模式</button>
    </div>
    <div class="key-status" id="keyStatus">正在检测密钥配置…</div>
  </section>

  <!-- 拍摄 / 上传 -->
  <section class="card">
    <div class="capture-grid">
      <button type="button" id="btnCamera" class="btn primary">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13.5" r="3.5"/>
        </svg>
        <span>拍照识别</span>
      </button>
      <button type="button" id="btnUpload" class="btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
        </svg>
        <span>上传图片</span>
      </button>
    </div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileUpload" accept="image/*" hidden>
    <p class="hint">提示：手机浏览器可直接调用摄像头；若提示需 HTTPS，将自动改用系统相机拍照。</p>
  </section>

  <!-- 预览 -->
  <section class="card preview-card" id="previewBox" hidden>
    <div class="preview-wrap"><img id="previewImg" alt="待识别图片预览"></div>
    <div class="preview-actions">
      <button type="button" class="btn small" id="btnClear">清除重来</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="card result-card" id="resultBox" hidden>
    <div class="result-head">
      <div class="result-badge" id="resultBadge"><span id="resultTitle">中风险</span></div>
      <span class="result-tag" id="resultTag">medium</span>
    </div>
    <p class="result-reason" id="resultReason"></p>
    <div class="result-meta" id="resultMeta"></div>
  </section>

  <!-- 会话记录 -->
  <section class="card history-card" id="historyBox" hidden>
    <h2>本次会话记录</h2>
    <ul id="historyList"></ul>
  </section>

  <footer>
    <p>风险等级：高风险 > 中风险 > 低风险 > 无风险 · 非楼道</p>
  </footer>
</main>

<!-- 摄像头取景层 -->
<div class="camera-overlay" id="cameraOverlay" hidden>
  <video id="cameraVideo" playsinline autoplay muted></video>
  <div class="overlay-bar">
    <button type="button" class="btn" id="btnCloseCamera">取消</button>
    <button type="button" class="btn shoot" id="btnShoot">拍照</button>
    <div class="spacer"></div>
  </div>
</div>

<!-- 加载中 -->
<div class="loading" id="loading" hidden>
  <div class="spinner"></div>
  <p>AI 正在识别中，请稍候…</p>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
