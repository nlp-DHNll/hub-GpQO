    - data:
        code: "def main(r1_results: list) -> dict:\n    import json\n    facts = []\n\
          \    seen = set()\n    url_to_idx = {}\n    for chunk in (r1_results or\
          \ []):\n        try:\n            arr = json.loads(chunk or '[]')\n    \
          \        if not isinstance(arr, list):\n                continue\n     \
          \       for f in arr:\n                if not isinstance(f, dict):\n   \
          \                 continue\n                fact = str(f.get('fact') or\
          \ '').strip()\n                if not fact or fact in seen:\n          \
          \          continue\n                seen.add(fact)\n                url\
          \ = str(f.get('source_url') or '').strip()\n                title = str(f.get('source_title')\
          \ or '').strip()\n                idx = 0\n                if url:\n   \
          \                 if url not in url_to_idx:\n                        url_to_idx[url]\
          \ = len(url_to_idx) + 1\n                    idx = url_to_idx[url]\n   \
          \             facts.append({\n                    \"fact\": fact,\n    \
          \                \"source_url\": url,\n                    \"source_title\"\
          : title,\n                    \"confidence\": str(f.get('confidence') or\
          \ 'low'),\n                    \"source_idx\": idx\n                })\n\
          \        except Exception:\n            continue\n    return {\"facts\"\
          : facts}\n"
        code_language: python3
        desc: 解析并合并迭代抽取的事实，按来源去重编号
