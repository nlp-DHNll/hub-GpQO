    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 综合全部事实，生成带章节与来源标注的结构化研究报告
        model:
          completion_params:
            max_tokens: 8192
            temperature: 0.3
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: a1000000-0000-4000-8000-000000000007
          role: user
          text: '你是资深研究分析师，负责把检索获得的事实综合成一份结构化研究报告。


            研究主题：{{#topic#}}

            已抽取事实（JSON 数组，字段：fact/source_url/source_title/confidence/source_idx，source_idx
            为来源编号，0 表示无来源）：

            {{#facts#}}


            请输出最终研究报告（Markdown），必须包含以下章节：

            1. # 摘要 —— 300 字以内的核心结论概述；

            2. ## 正文 —— 按主题维度分节（### 小节），整合事实、关键数据与对比，正文引用来源用 [来源编号] 标注（编号=source_idx）；

            3. ## 关键结论 —— 每条结论一行，格式：**结论**（置信度：高/中/低）[来源编号]；

            4. ## 遗留问题 —— 列出证据不足、尚未解决、需进一步核实的问题（基于已检索事实判断）；

            5. ## 置信度说明 —— 说明置信度判定规则（高/中/低），并声明：无来源支撑的推断一律标注【模型推断】。


            写作要求：

            - 所有事实必须来自 facts，不得编造其中不存在的数字、结论或来源；

            - 每条事实按 source_idx 关联来源；source_idx 为 0 的事实没有来源，引用时写【模型推断】；

            - 综合内容客观中立，冲突信息要并列呈现并说明分歧；

            - 使用中文，Markdown 格式；不要输出"来源列表"章节（来源列表会单独生成）。

            '
