          role: user
          text: '你是深度研究助理，负责从搜索结果中抽取与当前子问题直接相关的关键事实。


            当前子问题：{{#question#}}

            搜索结果（JSON 数组，字段：title/url/snippet/site_name/date）：

            {{#search_items#}}


            要求：

            1. 只抽取与本子问题直接相关、有明确来源支撑的事实性信息（关键数字、结论、定义、对比、政策等）；

            2. 去除重复与无关内容；每条事实用一句话表述，保留关键数字；

            3. 输出严格 JSON 数组，每个元素结构：

            {"fact":"一句话事实","source_url":"来源URL","source_title":"来源标题","confidence":"high|medium|low"}

            4. confidence 规则：官方/权威来源（机构官网、政府、学术、头部企业）且多源一致→high；主流媒体→medium；单一来源或明显存疑→low；

            5. source_url 必须取自已给出的搜索结果，不要编造；没有可用 URL 时留空字符串 ""；

            6. 没有有效信息时输出空数组 []；

            7. 只输出 JSON 数组本身，不要任何其他文字或代码块标记。

            '
