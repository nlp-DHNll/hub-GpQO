    - data:
        code: "def main(response: str) -> dict:\n    import json\n    items = []\n\
          \    try:\n        data = json.loads(response or '{}')\n        pages =\
          \ ((data.get('data') or {}).get('webPages') or {})\n        for p in (pages.get('value')\
          \ or [])[:20]:\n            if not isinstance(p, dict):\n              \
          \  continue\n            url = str(p.get('url') or '').strip()\n       \
          \     if not url:\n                continue\n            snippet = str(p.get('snippet')\
          \ or '') or str(p.get('summary') or '')\n            items.append({\n  \
          \              \"title\": str(p.get('name') or ''),\n                \"\
          url\": url,\n                \"snippet\": snippet[:500],\n             \
          \   \"site_name\": str(p.get('siteName') or ''),\n                \"date\"\
          : str(p.get('datePublished') or '')\n            })\n    except Exception\
          \ as e:\n        items = [{\"title\": \"解析失败\", \"url\": \"\", \"snippet\"\
          : \"错误：\" + str(e), \"site_name\": \"\", \"date\": \"\"}]\n    return {\"\
          items\": items}\n"
        code_language: python3
        desc: 解析博查返回的 JSON，提取网页列表
        isInIteration: true
