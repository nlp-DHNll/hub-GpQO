    - data:
        code: "def main(plan_text: str, topic: str) -> dict:\n    import json\n  \
          \  import re\n    text = (plan_text or '').strip()\n    text = re.sub(r'^```[a-zA-Z]*\\\
          s*', '', text).strip()\n    text = re.sub(r'\\s*```$', '', text).strip()\n\
          \    arr = []\n    try:\n        parsed = json.loads(text)\n        if isinstance(parsed,\
          \ list):\n            arr = parsed\n    except Exception:\n        m = re.search(r'\\\
          [.*\\]', text, re.S)\n        if m:\n            try:\n                arr\
          \ = json.loads(m.group(0))\n            except Exception:\n            \
          \    arr = []\n    if not isinstance(arr, list):\n        arr = []\n   \
          \ arr = [str(q).strip() for q in arr if isinstance(q, str) and str(q).strip()]\n\
          \    arr = arr[:8]\n    if not arr:\n        t = str(topic or '').strip()\n\
          \        arr = [t] if t else ['请综述该主题的现状、关键玩家、数据与趋势']\n    return {\"sub_questions\"\
          : arr, \"sub_count\": len(arr)}\n"
        code_language: python3
        desc: 将 LLM 输出的 JSON 解析为子问题数组
        outputs:
          sub_count:
            children: null
            type: number
          sub_questions:
            children: null
            type: array[string]
        selected: false
