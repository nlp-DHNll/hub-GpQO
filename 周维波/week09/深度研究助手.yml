            研究主题：{{#topic#}}


            要求：

            1. 拆解 4~8 个子问题，覆盖该主题的关键维度（例如：现状与基本事实、主要玩家/方案/产品对比、关键数据与市场规模、挑战与瓶颈、趋势与相关政策等，按主题性质调整）；

            2. 每个子问题写成一句完整、可直接搜索的提问；

            3. 子问题之间尽量不重叠、可独立检索；

            4. 只输出一个 JSON 字符串数组，不要输出任何解释、前后缀或 Markdown 代码块。


            输出示例：

            ["子问题1","子问题2","子问题3"]

            '
