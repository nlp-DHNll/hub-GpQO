# 招投标线索的关键词。标题命中 include 的词条才算 ESG 相关；core 是三类核心词，extended 是延伸词。
include:
  core: [ESG, 可持续发展, 社会责任, CSR, 双碳, 碳达峰, 碳中和, 碳排放, 碳核查, 碳盘查, 碳核算, 碳足迹, 碳资产, 碳交易, 碳市场, 碳排放权, CCER, 温室气体, 碳汇, 零碳, 碳捕集, CCUS, 气候投融资, 碳标识]
  extended: [低碳, 绿色工厂, 绿色园区, 绿色供应链, 能源审计, 能源管理体系, 清洁生产, 转型金融, 绿色金融, 绿色生产]
# 标题含这些词的不是 ESG 项目
exclude: [活性炭, 碳酸, 碳纤维, 碳素, 碳电极, 碳刷, 碳带, 碳粉, 碳化硅, 碳化硼, 碳分子筛, 碳钢, 碳罐, 渗碳, 脱碳层, 增碳剂, 炭黑, 碳黑]
# "二氧化碳"只有与下面任一词同时出现才算
co2_context: [排放, 捕集, 封存, 核算, 清单, 利用, 回收, 减排]
# monitor.py 用核心关键词与这些词拼检索式
notice_words: [招标公告, 中标公告]
