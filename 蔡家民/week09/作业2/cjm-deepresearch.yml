            要求：

            1. 子问题应覆盖研究主题的不同角度。

            2. 每个子问题必须明确、具体，并能够直接作为搜索词使用。

            3. 不要回答原问题，只负责拆分。

            4. 不要输出解释、标题或Markdown代码块。

            5. 严格按照指定的结构化格式输出。


            输出示例：

            {"sub_questions":["子问题1","子问题2","子问题3"]}

