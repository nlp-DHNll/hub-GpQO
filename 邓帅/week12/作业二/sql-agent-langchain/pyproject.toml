[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinook-sql-agent-langchain"
version = "0.1.0"
description = "SQL agent workflow over the Chinook SQLite database, rebuilt with LangChain/LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-openai>=1.4,<2",
    "langgraph>=1.2,<2",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.scripts]
sql-agent-langchain = "sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# db/ 组件与 openai-agents 版实现保持一致：列统计用 bare except 做降级，
# 新版 ruff 的 BLE001 对此报错，这里显式忽略。
ignore = ["BLE001"]
