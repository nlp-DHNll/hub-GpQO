    - data:
        code: "import json\n\n\ndef main(state, init_state) -> dict:\n    \"\"\"每轮调度:惰性初始化\
          \ state,取出本条待搜查询。\n\n    state 循环变量初始值只能是常量(空 object),首轮由此节点从规划解析输出构建;\n\
          \    batch_clear 表示本条处理完后当前批次是否清空,驱动后续分流(未清空→继续搜,清空→反思)。\n    \"\"\"\n \
          \   st = state\n    if isinstance(st, str):\n        try:\n            st\
          \ = json.loads(st)\n        except Exception:\n            st = {}\n   \
          \ if not isinstance(st, dict):\n        st = {}\n    # 惰性初始化:首轮(或异常空状态)用规划解析产物构建\n\
          \    if not st.get(\"pending\") and not st.get(\"plan\"):\n        st =\
          \ init_state if isinstance(init_state, dict) else {}\n    pending = [q for\
          \ q in (st.get(\"pending\") or []) if str(q).strip()]\n    query = str(pending[0]).strip()\
          \ if pending else \"\"\n    batch_clear = \"true\" if len(pending) <= 1\
          \ else \"false\"\n    return {\"query\": query, \"batch_clear\": batch_clear}\n"
        code_language: python3
        desc: 取下一条查询;state 惰性初始化;计算批次是否即将清空
