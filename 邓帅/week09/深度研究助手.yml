    - data:
        code: "import json\nimport re\n\n\ndef main(topic: str, plan_text: str) ->\
          \ dict:\n    \"\"\"解析规划 LLM 输出的子问题数组,构建研究循环的初始 state。\n\n    对应原项目 plan_node:解析失败时降级为以主题本身为查询。\n\
          \    \"\"\"\n    queries = []\n    try:\n        m = re.search(r'\\[.*\\\
          ]', plan_text or '', re.S)\n        queries = [str(q).strip() for q in json.loads(m.group(0))\
          \ if str(q).strip()][:6]\n    except Exception:\n        queries = []\n\
          \    degraded = False\n    if not queries:\n        queries = [topic]\n\
          \        degraded = True\n    state = {\n        \"plan\": queries,\n  \
          \      \"pending\": list(queries),\n        \"searched\": [],\n        \"\
          findings\": [],\n        \"sources\": {},\n        \"seen_urls\": [],\n\
          \        \"search_count\": 0,\n        \"round\": 0,\n        \"gaps\":\
          \ \"\",\n        \"degraded\": degraded,\n    }\n    return {\"queries\"\
          : queries, \"init_state\": state}\n"
        code_language: python3
        desc: 容错解析子问题,构建初始 state(对应 _structured 的解析与 plan 降级)
        outputs:
          init_state:
            type: object
          queries:
            type: array[string]
        selected: false
        title: 规划解析
        type: code
        variables:
        - value_selector:
          - start
          - topic
          variable: topic
        - value_selector:
          - plan
          - text
