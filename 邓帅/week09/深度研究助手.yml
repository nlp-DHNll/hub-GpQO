          - {}\".format(q) for q in (st.get(\"plan\") or []))\n    return {\n    \
          \    \"findings_lines\": findings_lines,\n        \"sources_md\": sources_md,\n\
          \        \"plan_lines\": plan_lines,\n        \"gaps\": st.get(\"gaps\"\
          ) or \"\",\n        \"degraded\": \"true\" if st.get(\"degraded\") else\
          \ \"false\",\n        \"round\": st.get(\"round\") or 0,\n        \"search_count\"\
          : st.get(\"search_count\") or 0,\n        \"sources_count\": len(url_index),\n\
          \    }\n"
