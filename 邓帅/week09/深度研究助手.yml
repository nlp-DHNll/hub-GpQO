          name: qwen3.7-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: 8b7c6d5e-6d7e-4e8f-8f0a-2f3a4b5c6d7e
          role: system
          text: 你是研究报告撰写者。基于研究发现撰写研究报告的正文部分(markdown)。
        - id: 9c8d7e6f-7e8f-4d9a-8a1b-3a4b5c6d7e8f
          role: user
          text: '研究主题:{{#start.topic#}}


            参考子问题(目录可按内容自由重组,不必逐一对应):

            {{#prep_report.plan_lines#}}


            研究发现(格式:[来源编号] 要点(佐证:原文摘录)):

            {{#prep_report.findings_lines#}}


