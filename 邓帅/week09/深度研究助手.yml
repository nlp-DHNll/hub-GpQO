    - data:
        code: "import json\nimport re\n\nMAX_ROUNDS = 5      # 对应原项目 settings.max_rounds\n\
          SEARCH_BUDGET = 30  # 对应原项目 settings.search_budget\nMAX_NEW_QUERIES = 4\
          \ # 对应原项目 settings.max_new_queries\n\n\ndef main(state, reflect_text: str,\
          \ new_results, findings, extract_degraded: str) -> dict:\n    \"\"\"批次清空:累积本轮收获并落轮次档,解析反思输出,判定收敛(对应\
          \ route_after_reflect)。\n\n    收敛条件(任一满足):sufficient / 轮数达上限 / 搜索预算耗尽 /\
          \ 无新查询;\n    反思输出解析失败时降级为直接收敛(对应原项目 reflect 降级)。\n    \"\"\"\n    st = state\
          \ if isinstance(state, dict) else {}\n    st = dict(st)\n    # --- 累积(与累积状态节点同构)\
          \ ---\n    pending = [q for q in (st.get(\"pending\") or []) if str(q).strip()]\n\
          \    searched = list(st.get(\"searched\") or [])\n    if pending:\n    \
          \    searched.append(str(pending[0]).strip())\n    st[\"pending\"] = []\n\
          \    st[\"searched\"] = searched\n    st[\"findings\"] = list(st.get(\"\
          findings\") or []) + list(findings or [])\n    sources = dict(st.get(\"\
          sources\") or {})\n    seen = set(st.get(\"seen_urls\") or [])\n    for\
          \ r in (new_results or []):\n        u = r.get(\"url\", \"\")\n        if\
          \ u:\n            sources[u] = {\"title\": r.get(\"title\", \"\"), \"summary\"\
          : r.get(\"summary\", \"\")}\n            seen.add(u)\n    st[\"sources\"\
          ] = sources\n    st[\"seen_urls\"] = list(seen)\n    st[\"search_count\"\
          ] = int(st.get(\"search_count\") or 0) + 1\n    st[\"degraded\"] = bool(st.get(\"\
          degraded\")) or (extract_degraded == \"true\")\n    st[\"round\"] = int(st.get(\"\
          round\") or 0) + 1\n    # --- 解析反思输出 ---\n    sufficient = True\n    gaps\
          \ = \"反思输出解析失败,提前收敛\"\n    new_queries = []\n    try:\n        m = re.search(r'\\\
          {.*\\}', reflect_text or '', re.S)\n        obj = json.loads(m.group(0))\n\
          \        sufficient = bool(obj.get(\"sufficient\"))\n        gaps = str(obj.get(\"\
          gaps\") or \"\")\n        raw_queries = [str(q).strip() for q in (obj.get(\"\
          new_queries\") or []) if str(q).strip()]\n        new_queries = []\n   \
          \     for q in raw_queries:\n            if q not in new_queries and q not\
          \ in searched:\n                new_queries.append(q)\n        new_queries\
          \ = new_queries[:MAX_NEW_QUERIES]\n    except Exception:\n        st[\"\
          degraded\"] = True\n    st[\"gaps\"] = gaps\n    # --- 收敛判定(对应 route_after_reflect)\
          \ ---\n    stop = (\n        sufficient\n        or st[\"round\"] >= MAX_ROUNDS\n\
          \        or st[\"search_count\"] >= SEARCH_BUDGET\n        or not new_queries\n\
          \    )\n    if not stop:\n        st[\"pending\"] = new_queries  # 下一批次\n\
          \    return {\"new_state\": st, \"should_stop\": \"true\" if stop else \"\
          false\"}\n"
        code_language: python3
        desc: 收敛判定(sufficient/轮数/预算/无新查询),更新 state 与 should_stop
