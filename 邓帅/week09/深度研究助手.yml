          role: system
          text: 你是研究审阅者。对照子问题检查已有研究发现,判断信息是否充分。请只输出 JSON,不要输出任何其他文字。
        - id: 7a6b5c4d-5c6d-4d7e-8e0f-1e2f3a4b5c6d
          role: user
          text: '研究主题:{{#start.topic#}}

            {{#build_context.reflect_context#}}


            请输出 JSON:{"sufficient": true/false, "gaps": "仍缺失的关键信息,简要", "new_queries":
            ["信息不足时不超过4条新的检索查询,已检索过的查询不要重复"]}'
