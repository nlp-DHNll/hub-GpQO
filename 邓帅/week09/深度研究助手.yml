          \ list(findings or [])\n    sources = dict(st.get(\"sources\") or {})\n\
          \    seen = set(st.get(\"seen_urls\") or [])\n    for r in (new_results\
          \ or []):\n        u = r.get(\"url\", \"\")\n        if u:\n           \
