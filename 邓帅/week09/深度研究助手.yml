    - data:
        code: "import json\n\ndef main(body: str, state) -> dict:\n    \"\"\"解析搜索响应,按\
          \ seen_urls 跨轮去重,选首条新结果作为本条查询的阅读页。\n\n    对应原项目 search_node 的去重 + read_node\
          \ 的 URL 挑选(核心循环从简:取首条新结果,不做 LLM 挑选)。\n    new_results 是本轮全部新结果,供 sources/seen_urls\
          \ 累积。\n    \"\"\"\n    st = state if isinstance(state, dict) else {}\n \
          \   seen = set(st.get(\"seen_urls\") or [])\n    results = []\n    try:\n\
          \        data = json.loads(body or \"{}\")\n        for item in (data.get(\"\
          data\", {}).get(\"webPages\", {}).get(\"value\") or []):\n            url\
          \ = item.get(\"url\", \"\")\n            if url and url not in seen and\
          \ all(r[\"url\"] != url for r in results):\n                results.append({\n\
          \                    \"url\": url,\n                    \"title\": item.get(\"\
          name\", \"\"),\n                    \"summary\": (item.get(\"summary\")\
          \ or \"\")[:300],\n                })\n    except Exception:\n        results\
          \ = []\n    chosen = results[0] if results else {\"url\": \"\", \"title\"\
          : \"\", \"summary\": \"\"}\n    return {\n        \"url\": chosen[\"url\"\
          ],\n        \"title\": chosen[\"title\"],\n        \"summary\": chosen[\"\
          summary\"],\n        \"new_results\": results,\n    }\n"
        code_language: python3
        desc: 解析响应、按 seen_urls 去重、选 1 条新 URL(空/异常继续)
        isInLoop: true
        loop_id: research_loop
        outputs:
          new_results:
            type: array[object]
          summary:
            type: string
          title:
            type: string
          url:
            type: string
        selected: false
        title: 去重选页
        type: code
        variables:
        - value_selector:
          - search_aggr
          - output
          variable: body
        - value_selector:
          - research_loop
