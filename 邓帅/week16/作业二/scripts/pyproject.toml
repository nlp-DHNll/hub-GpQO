[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "."

[tool.ruff.lint.per-file-ignores]
"esgscript/prompts.py" = ["E501"]  # 提示词是一整句中文，拆行会改变给模型看的措辞
