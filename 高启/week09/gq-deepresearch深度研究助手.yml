    - data:
        code: "import json\n\ndef main(body: str) -> dict:\n    try:\n        data\
          \ = json.loads(body)\n    except Exception:\n        return {\"result\"\
          : \"\"}\n    pages = (data.get(\"data\") or {}).get(\"webPages\", {}).get(\"\
          value\") or []\n    lines = []\n    for i, p in enumerate(pages[:10], 1):\n\
          \        name = p.get(\"name\", \"\")\n        url = p.get(\"url\", \"\"\
          )\n        summary = p.get(\"summary\") or p.get(\"snippet\") or \"\"\n\
          \        if summary:\n            lines.append(f\"{i}. {name}\\n   链接: {url}\\\
          n   摘要: {summary}\")\n    return {\"result\": \"\\n\\n\".join(lines) if\
          \ lines else \"\"}"
