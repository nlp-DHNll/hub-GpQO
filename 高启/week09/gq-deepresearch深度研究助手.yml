          \ = text.strip()\n\n    # 解析内层 JSON\n    data = json.loads(inner_json)\n\
          \    keywords = data.get(\"keywords\", [])\n\n    # Dify 要求返回 dict\n   \
          \ return {\"keywords\": keywords}"
