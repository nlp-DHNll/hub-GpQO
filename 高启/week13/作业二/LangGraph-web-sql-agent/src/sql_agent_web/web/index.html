<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Chinook SQL Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="SQL Agent 首页">
          <span class="brand-mark">S</span>
          <span><strong>SQL Agent</strong><small>LANGGRAPH WORKSPACE</small></span>
        </a>
        <div class="sidebar-rule"></div>
        <div class="side-label">数据源</div>
        <div class="database-card">
          <span class="database-icon">▤</span>
          <span><strong>Chinook</strong><small>SQLite · 只读查询</small></span>
          <span class="online-dot" title="本地数据库"></span>
        </div>
        <div class="side-label examples-label">试试这样问</div>
        <button class="example" data-question="总共有多少张专辑？">
          <span>↗</span> 总共有多少张专辑？
        </button>
        <button class="example" data-question="哪几位艺人的专辑数量最多？列出前 5 名。">
          <span>↗</span> 哪些艺人的专辑最多？
        </button>
        <button class="example" data-question="每种音乐类型有多少首曲目？">
          <span>↗</span> 每种音乐类型有多少首曲目？
        </button>
        <div class="sidebar-bottom">
          <span class="shield">◈</span>
          <span>查询经过安全校验<br />数据库连接为只读</span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="breadcrumb">工作区 <span>/</span> <strong>自然语言查询</strong></div>
          <div class="model-pill"><span class="online-dot"></span><span id="model-name">LangGraph Agent</span></div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-icon">✦</div>
            <p class="eyebrow">CHINOOK DATABASE ASSISTANT</p>
            <h1>用自然语言，<br /><em>探索你的数据。</em></h1>
            <p class="welcome-copy">提出一个关于音乐商店数据的问题，我会生成并校验 SQL，再用查询结果回答你。</p>
            <div class="welcome-tags"><span>11 张数据表</span><span>只读执行</span><span>结果可追溯</span></div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <footer class="composer-wrap">
          <form class="composer" id="query-form">
            <textarea id="question" rows="1" maxlength="1000" placeholder="问一个关于 Chinook 数据库的问题…" aria-label="查询问题"></textarea>
            <div class="composer-bottom">
              <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
              <button class="send-button" id="send-button" type="submit" aria-label="发送问题">
                <span>发送</span><span class="send-arrow">↑</span>
              </button>
            </div>
          </form>
          <p class="disclaimer">AI 生成的查询结果可能有误，请结合 SQL 和数据明细核对。</p>
        </footer>
      </main>
    </div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
