# ESG 招标情报 —— 赛道、关键词、金额分档、阈值
# 本文件是唯一真源：改关键词只需改这里，代码不用动。
version: 1

search:
  provider: bocha                 # bocha | fixture
  endpoint: https://api.bochaai.com/v1/web-search
  count: 50                       # 单次返回条数，博查上限 50
  timeout: 20                     # 秒
  retry: 2                        # 失败重试次数（指数退避）
  concurrency: 4                  # 同时发出的检索请求数；调高提速但更易触发 429
  max_queries: 14                 # 单次运行最多发出的 query 数，控成本
  query_suffix: 招标公告          # 追加在关键词后，提升召回精度
  cache_ttl_hours: 24             # 检索缓存有效期

# ---------------------------------------------------------------- 赛道
tracks:
  core:
    T1:
      name: ESG 报告编制与鉴证
      # 前两个会被 query_plan.core_per_track 取作检索词，必须放最具代表性的写法
      # 不放裸「报告编制」：它会把「环评报告编制」「地质灾害评估报告编制」
      # 「节能评估报告编制」全吸进 ESG 赛道（90 天窗口实测 40 条里 4 条是这类）。
      keywords: [ESG报告, 可持续发展报告, 社会责任报告, 第三方鉴证, ESG信息披露]
    T2:
      name: ESG 咨询与管理提升
      keywords: [ESG咨询, ESG体系, 信息披露辅导, ESG培训, 供应链ESG]
    T3:
      name: ESG 评级提升
      keywords: [ESG评级, MSCI评级, 华证评级, 中证ESG, 评级诊断]
    T4:
      name: 双碳规划与路径
      keywords: [碳达峰, 碳中和, 碳达峰行动方案, 双碳规划, 达峰路径]
    T5:
      name: 碳资产
      # 现实中绝大多数标书写「碳排放核查」「温室气体排放核查」，而不是「碳核查」。
      # 只认「碳核查」会漏掉最主流写法（两年窗口实测：成都统一、六安市碳管理体系
      # 等项目全部因关键词不匹配被丢弃）。
      keywords: [碳排放核查, 碳盘查, 碳核查, 温室气体排放核查, 碳足迹, 碳资产管理, CCER, 碳管理体系]
      sub:                        # 子类只做下钻，排行按父类 T5 汇总
        碳盘查: [碳盘查, 碳排放盘查, 碳足迹]
        碳核查: [碳核查, 碳排放核查, 温室气体排放核查, 第三方核查]
        碳资产管理: [碳资产管理, 碳资产开发, 碳管理体系]
        CCER: [CCER, 自愿减排]

  # 扩展赛道：单列统计，不参与核心排行
  extended:
    绿色金融: [绿色债券, 绿色信贷, 可持续挂钩债券, 绿色金融]
    绿色工厂园区: [绿色工厂, 绿色园区, 绿色供应链]
    碳交易碳普惠: [碳交易, 碳普惠, 碳配额, 履约服务]
    能耗双控节能诊断: [节能诊断, 能源审计, 节能量审核, 能效诊断]

  # 边缘纳入：必须同时命中两组词，否则剔除
  edge:
    require_any: [ESG, 双碳, 碳达峰, 碳中和, 碳排放, 温室气体]
    also_require_any: [环保咨询, 环评, 环境影响评价, 清洁生产]

# ---------------------------------------------------------------- 金额分档（元）
# 左闭右开；最后一档 max 为 null 表示无上界
amount_buckets:
  - {label: "<10万", min: 0, max: 100000}
  - {label: "10–50万", min: 100000, max: 500000}
  - {label: "50–100万", min: 500000, max: 1000000}
  - {label: "100–500万", min: 1000000, max: 5000000}
  - {label: "≥500万", min: 5000000, max: null}

# ---------------------------------------------------------------- 相关度
relevance:
  # 按主赛道分组设阈值：核心 0.6 / 扩展 0.65 / 边缘 0.75
  # 含义：核心/扩展必须「标题命中关键词」才能过线（title_base=0.65），
  #       只命中正文的记录落在灰区，标记待复核而不是静默丢弃。
  threshold: {core: 0.6, extended: 0.65, edge: 0.75}
  gray_low: 0.2                   # 低于此值直接丢弃（= 正文只命中 1 个关键词）
  weights:
    title_base: 0.65              # 标题命中至少 1 个关键词的基础分
    title_extra: 0.30             # 标题命中 ≥2 个再叠加（封顶）
    body_bonus: 0.30              # 正文最多再贡献 30%
    body_saturate: 3              # 正文命中 3 个即达到 body_bonus 上限

# ---------------------------------------------------------------- 公告性质闸门
# 赛道关键词只能判断「主题是否相关」，判断不了「这是不是一条采购公告」。
# 真实检索里研报、债券上市公告、协会新闻都会命中赛道关键词，必须单独挡住。
# 实测（2026-11 真实检索 291 页）：不过闸门时 25 条里有 8 条不是招标内容（32%）。
# 规则：标题命中 deny_any 任何一词 → 直接丢弃（deny 优先于 require）；
#       否则标题或摘要需命中 require_any 至少一词。
intent:
  require_any:                    # 采购行为信号词
    - 招标
    - 采购
    - 询价
    - 询比
    - 竞争性谈判
    - 竞争性磋商
    - 磋商
    - 谈判
    - 比选
    - 遴选
    - 竞价
    - 征集
    - 中标
    - 成交
    - 资格预审
    - 公告
    - 公示
  deny_any:                       # 明显不是采购需求的体裁（只查标题，避免正文误杀）
    - 研报
    - 研究报告
    - 快讯
    - 周报
    - 月报
    - 点评
    - 解读
    - 行情
    - 指数
    - 数据跟踪
    # 注意：不能只写「上市」——「某上市公司ESG报告编制服务采购」是正常招标，
    # 「上市公司/上市银行」是采购方身份。只挡债券上市这类具体事件。
    - 证券交易所
    - 上市公告
    - 上市交易
    - 上市流通
    - 挂牌上市
    - 上市仪式
    - 上市有关
    - 债券上市
    - 招股
    - 募集说明书
    - 白皮书
    - 招聘
    - 论坛
    - 峰会
    - 名单
    - 清单
    - 政策解读
    - 补助
    - 奖补
    - 补贴公示
    # 债券发行公告：冠名「绿色」已被赛道关键词命中，但体裁是融资公告不是采购。
    # 两年窗口实测：40 条里 12 条是这类，是最大的噪音源。
    - 发行完毕
    - 发行完成
    - 成功发行
    - 累计成交
    - 发行结果
    - 兑付
    - 发行总额
    - 发行办法
    - 发行公告
    - 发行信息
    - 付息
    - 票面利率
    - 申购
    - 债券公告
    - 中期票据
    - 融资券
    - 债务融资工具
    - 债01
    # 政策征求意见稿：有「公告」「实施方案」，但没有任何采购行为
    - 征求意见

# ---------------------------------------------------------------- 检索 query 计划
# 每个赛道取前 N 个关键词组 query；三类赛道各自配额，总条数受 search.max_queries 约束。
# 注意：core_per_track × 核心赛道数 + extended_total + edge_total ≤ max_queries，
#       否则后面的赛道拿不到 query，扩展/边缘会静默失效。
query_plan:
  core_per_track: 2              # 每个核心赛道取前 2 个关键词；1 个时会漏掉半壁写法
  extended_total: 2
  edge_total: 1
