# 行业预设：制造业与产业园区
#
# 合并语义：字典递归合并，**列表整段替换**。下面写到的 keywords 都是完整集合，
# 不是追加。没写到的字段沿用 config/scope.yaml。
#
# 与通用口径的差别：制造企业的采购重心是「产品碳足迹核算 / 绿色工厂第三方
# 评价 / 供应链碳管理」，出口型企业尤其看 CBAM 相关的碳足迹与碳标签。
name: manufacturing
title: 制造业与园区
description: 出口制造 / 产业园区：产品碳足迹、绿色工厂、供应链碳管理与能耗诊断

scope:
  tracks:
    core:
      T1:
        name: ESG 报告编制与鉴证
        keywords: [ESG报告, 可持续发展报告, 社会责任报告, 第三方鉴证, ESG信息披露, 环境信息披露]
      T5:
        name: 碳资产
        keywords:
          - 碳足迹
          - 产品碳足迹
          - 碳排放核查
          - 碳盘查
          - 碳核查
          - 温室气体排放核查
          - 碳管理体系
          - 碳标签
          - ISO14064
        sub:
          碳足迹: [碳足迹, 产品碳足迹, 碳标签, 生命周期评价, LCA]
          碳核查: [碳核查, 碳排放核查, 温室气体排放核查, 第三方核查]
          碳管理体系: [碳管理体系, ISO14064, 碳管理体系认证]
    extended:
      绿色工厂园区: [绿色工厂, 绿色园区, 绿色供应链, 绿色设计产品, 零碳工厂, 零碳园区]
      能耗双控节能诊断: [节能诊断, 能源审计, 节能量审核, 能效诊断, 节能降碳改造]
      碳交易碳普惠: [碳交易, 碳普惠, 碳配额, 履约服务]
      绿色金融: [绿色债券, 绿色信贷, 可持续挂钩债券, 绿色金融]
  query_plan:
    core_per_track: 2
    extended_total: 2
    edge_total: 1
