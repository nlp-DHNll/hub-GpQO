# 行业预设：能源电力（发电集团、电网、油气、新能源运营商）
#
# 合并语义：字典递归合并，**列表整段替换**。下面写到的 keywords 都是完整集合，
# 不是追加。没写到的字段沿用 config/scope.yaml。
#
# 与通用口径的差别：能源集团的采购重心是碳核查/碳盘查（履约前置工作）、
# 绿电绿证与 CCER 开发，而不是 ESG 报告编制。因此 T5 放在首位、关键词扩到
# 「绿电交易 / 绿证 / 碳配额履约」这些标书里的真实写法。
name: energy
title: 能源电力
description: 发电/电网/油气/新能源：碳核查、碳盘查、绿电绿证、CCER 与零碳园区

scope:
  tracks:
    core:
      T4:
        name: 双碳规划与路径
        keywords: [碳达峰, 碳中和, 双碳规划, 达峰行动方案, 零碳园区, 近零碳, 碳达峰试点]
      T5:
        name: 碳资产
        # 前两个是检索词（core_per_track=2），必须是标书里最高频的写法
        keywords:
          - 碳排放核查
          - 碳盘查
          - 碳核查
          - 温室气体排放核查
          - 碳足迹
          - 碳资产管理
          - CCER
          - 碳管理体系
          - 碳配额履约
          - 绿电交易
          - 绿证
        sub:
          碳盘查: [碳盘查, 碳排放盘查, 碳足迹]
          碳核查: [碳核查, 碳排放核查, 温室气体排放核查, 第三方核查]
          碳资产管理: [碳资产管理, 碳资产开发, 碳管理体系, 碳配额履约]
          CCER: [CCER, 自愿减排, 减排量开发]
          绿电绿证: [绿电交易, 绿证, 绿色电力证书]
    extended:
      绿电绿证: [绿电交易, 绿证, 绿色电力证书, 可再生能源消纳, 绿电直连]
      碳交易碳普惠: [碳交易, 碳普惠, 碳配额, 履约服务, 碳市场]
      节能降碳改造: [节能诊断, 能源审计, 节能量审核, 能效诊断, 节能降碳改造]
      绿色金融: [绿色债券, 绿色信贷, 可持续挂钩债券, 绿色金融, 转型金融]
  query_plan:
    core_per_track: 2
    extended_total: 2
    edge_total: 1
